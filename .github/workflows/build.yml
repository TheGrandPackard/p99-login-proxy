name: build

on:
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # Intel macOS, cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            build_args: --config src-tauri/tauri.macos.bundle.json
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add target to pinned toolchain
        # rust-toolchain.toml pins the channel, so the target added to stable
        # above is not visible to the toolchain cargo actually uses.
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.build_args }}
        env:
          CI: true
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app="$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --keepParent "$app" "P99LoginProxy-macos-x86_64.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-x86_64-build
          path: P99LoginProxy-macos-x86_64.zip
