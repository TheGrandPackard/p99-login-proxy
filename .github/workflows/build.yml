name: build

on:
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --config src-tauri/tauri.macos.bundle.json
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.tauri_args }}
        env:
          CI: true
      # upload-artifact drops executable permissions, so the .app must be archived first.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "target/${{ matrix.target }}/release/bundle/macos/P99 Login Proxy.app" P99LoginProxy-mac.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: P99LoginProxy-mac
          path: P99LoginProxy-mac.zip
          if-no-files-found: error
